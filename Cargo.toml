[package]
name = "lossy"
version = "0.1.0"
edition = "2024"

[build-dependencies]
lalrpop = "0.22.1"

[dependencies]
inkwell = { version = "0.5.0", features = ["llvm18-0"] }
anyhow = "1.0.97"
clap = { version = "4.5.37", features = ["derive"] }
lalrpop-util = { version = "0.21.0", features = ["lexer", "unicode"] }
logos = "0.15.0"
