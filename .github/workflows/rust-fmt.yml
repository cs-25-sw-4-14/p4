name: Format Rust Code

on:
  # Run on pushes to main branch
  push:
    branches: [ main ]
  # Allow manual triggering
  workflow_dispatch:

jobs:
  format:
    name: Format Rust code
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          components: rustfmt
      
      - name: Format Rust code
        run: |
          # Format all Rust files with 2024 edition
          find . -name "*.rs" -type f -print0 | xargs -0 rustfmt --edition 2024
