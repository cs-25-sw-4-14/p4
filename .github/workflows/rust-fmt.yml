name: Rust Format Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Allow manual triggering
  workflow_dispatch:

# Add permissions for creating pull requests
permissions:
  contents: write
  pull-requests: write

jobs:
  rustfmt:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: stable
        components: rustfmt

    - name: Check if formatting is needed
      id: fmt-check
      run: |
        # Run rustfmt in check mode first to see if changes are needed
        if ! cargo fmt -- --check; then
          echo "formatting_needed=true" >> $GITHUB_OUTPUT
        else
          echo "formatting_needed=false" >> $GITHUB_OUTPUT
        fi

    - name: Apply formatting changes
      if: steps.fmt-check.outputs.formatting_needed == 'true'
      run: |
        # Apply the formatting changes
        cargo fmt

    - name: Create Pull Request
      if: steps.fmt-check.outputs.formatting_needed == 'true'
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ github.token }}
        commit-message: "Apply rustfmt formatting"
        title: "Apply rustfmt formatting"
        body: |
          This PR applies rustfmt formatting to the codebase.
          
          The formatting changes were automatically generated by the Rust Format Check workflow.
        branch: rustfmt-formatting-fixes
        base: ${{ github.head_ref || github.ref_name }}
        delete-branch: true